name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run installer simulation
        run: bash test/sim.sh
      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build and sign APK
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(git rev-list --count HEAD)"
          else
            VERSION_NAME="dev"; VERSION_CODE=1
          fi
          export VERSION_NAME VERSION_CODE
          ./apk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KiCadLauncher
          path: apk/build/KiCadLauncher.apk
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apk/build/KiCadLauncher.apk install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes
